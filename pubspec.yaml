name: o2desk_mobile
description: "O2DESK Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  intl: ^0.20.3
  google_fonts: ^8.2.1
  file_picker: ^12.1.1
  url_launcher: ^6.3.0
  flutter_pdfview: ^1.4.5
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo_o2desk.png
    - assets/images/logo-inverse.png
    - assets/images/icon_o2desk.png